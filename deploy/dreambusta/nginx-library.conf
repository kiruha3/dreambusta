# Include INSIDE the HTTPS server for academy.dreamdocs.ru.
# Static root contains only a symlink named library pointing to DreamBusta dist/.
location = /library {
    return 301 /library/$is_args$args;
}

location ^~ /library/api/ {
    client_max_body_size 1100m;
    client_body_timeout 600s;
    proxy_pass http://127.0.0.1:5276/api/;
    include /etc/nginx/proxy_params;
    proxy_set_header X-DreamBusta-Client $remote_addr;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
}

location ~ ^/library/(embed(?:/|\.js$)|embed-assets/) {
    rewrite ^/library(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:5276;
    include /etc/nginx/proxy_params;
    proxy_set_header X-DreamBusta-Client $remote_addr;
    proxy_read_timeout 600s;
    proxy_buffering off;
}

location ~ ^/library/assets/.*\.mjs$ {
    root /var/www/dreambusta;
    default_type application/javascript;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
}

location /library/ {
    root /var/www/dreambusta;
    try_files $uri $uri/ /library/index.html;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
}
