server {
    listen 80;
    listen [::]:80;
    server_name dreambusta.45-9-12-136.sslip.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dreambusta-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://dreambusta.45-9-12-136.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dreambusta.45-9-12-136.sslip.io;

    ssl_certificate /etc/letsencrypt/live/dreambusta/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dreambusta/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DreamBustaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    root /opt/dreambusta/current/dist;
    index index.html;
    client_max_body_size 1100m;
    client_body_timeout 600s;

    location /api/ {
        proxy_pass http://127.0.0.1:5276;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DreamBusta-Client $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Module workers require a JavaScript MIME type even with older mime.types.
    location ~ ^/assets/.*\.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
    }
}
